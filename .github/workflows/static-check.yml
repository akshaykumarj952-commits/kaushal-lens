name: Static project check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f README.md
          test -f docs/DATA_SOURCES.md
          test -f docs/ARCHITECTURE.md
          echo "Required project files are present."
